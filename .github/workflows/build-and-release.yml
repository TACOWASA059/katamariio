name: Build and Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build

      - name: Collect JARs
        shell: bash
        run: |
          mkdir -p release-assets
          for dir in fabric/build/libs forge/build/libs neoforge/build/libs; do
            if [ -d "$dir" ]; then
              find "$dir" -maxdepth 1 -type f -name "*.jar" ! -name "*-dev.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" -print0 | while IFS= read -r -d '' file; do
                echo "Collecting: $file"
                cp "$file" release-assets/
              done
            fi
          done
          # Also check root build/libs as fallback
          if [ -d "build/libs" ]; then
            find build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-dev.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" -print0 | while IFS= read -r -d '' file; do
              cp "$file" release-assets/
            done
          fi
          ls -la release-assets

      - name: Publish Release Assets
        uses: ncipollo/release-action@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Build artifacts for ${{ github.ref_name }}.
            Source: ${{ github.repository }}@${{ github.sha }}
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          artifacts: "release-assets/*.jar"
          token: ${{ secrets.GITHUB_TOKEN }}
